services:
  t4a-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/time-4-action/t4a-admin:latest
    ports:
      - "3005:3005"
    env_file:
      - .env.local
    environment:
      PORT: 3005
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-https://admin.time-4-action.com}
    restart: unless-stopped
